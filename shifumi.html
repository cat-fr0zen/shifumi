<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shifumi</title>
 
</head>
<body>
  <main class="wrap">
    <h1>Shifumi</h1>
 
    <section class="card">
      <div class="btns">
        <button data-play="pierre">Pierre</button>
        <button data-play="feuille">Feuille</button>
        <button data-play="ciseaux">Ciseaux</button>
      </div>
 
      <div class="scores">
        <div><span id="win">0</span> victoire</div>
        <div><span id="draw">0</span> égalité</div>
        <div><span id="lose">0</span> défaite</div>
      </div>
 
      <button id="reset" class="reset">Réinitialiser le score</button>
      <div id="log" class="log" aria-live="polite"></div>
    </section>
  </main>
</html>
